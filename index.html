<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arbeitszeit · Work time</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#16191a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, practical, a tool used every day at the door of the workplace
   IDEA: the punch card by the gate, with the employee's own file behind it
   PICTURE: live clock and big stamp buttons; month sheet; personnel file with photo
   COLOUR and TYPE: GST black band, stone ground, GST green accent; Schibsted Grotesk
   LAYOUT: one phone column, bottom navigation with three views */
:root{color-scheme:light dark;--bg:light-dark(#e7e4df,#141615);--panel:light-dark(#fff,#1f2221);--ink:light-dark(#141210,#ece8e2);--mute:light-dark(#6b655d,#a39c92);--line:light-dark(#d3cec6,#353a38);--acc:#269282;--accSoft:light-dark(#dcefeb,#1d3a35);--warn:light-dark(#9a5b00,#e7a64a);--bad:light-dark(#b3261e,#f28b82);--ok:light-dark(#1f6b3a,#6cc18a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Schibsted Grotesk",system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
.brand{background:#16191a;color:#fff;padding:12px max(4vw,14px);display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand img.logo{height:38px;width:auto;display:block}
.who{display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;font:inherit;cursor:pointer;padding:4px;border-radius:99px;min-height:44px}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#269282;color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.av.big{width:96px;height:96px;font-size:32px}
.who span{font-size:14px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;gap:4px}.lang button{font:inherit;font-size:13px;min-height:36px;min-width:40px;border-radius:8px;border:1px solid #4a4f50;background:transparent;color:#fff;cursor:pointer}.lang button[aria-pressed=true]{background:var(--acc);border-color:var(--acc)}
.wrap{max-width:720px;margin:0 auto;padding:6px max(4vw,14px) 30px}
h2{font-size:20px;margin:0 0 10px;font-weight:800}
h3{font-size:16px;margin:18px 0 8px;font-weight:800}
.sync{font-size:13px;color:var(--mute);margin:6px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.clock{font-size:clamp(52px,16vw,84px);font-weight:800;line-height:1.05;text-align:center;font-variant-numeric:tabular-nums}
.date{text-align:center;color:var(--mute)}
.status{display:flex;justify-content:center;margin:10px 0 4px}
.pill{padding:4px 14px;border-radius:99px;font-weight:600;font-size:15px;border:1px solid currentColor}
.s-work{color:var(--ok)}.s-pause{color:var(--warn)}.s-off{color:var(--mute)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.btn{font:inherit;font-weight:600;font-size:17px;min-height:58px;border-radius:12px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;padding:6px 10px}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.wide{grid-column:1/-1}
.btn:disabled{opacity:.28;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.small{font:inherit;font-size:14px;min-height:44px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.small.danger{color:var(--bad);border-color:var(--bad)}
.small.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.small.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.alert{margin-top:10px;padding:12px 14px;border-radius:12px;font-weight:600;text-align:center}
.alert.bad{background:var(--bad);color:#fff}.alert.info{border:2px solid var(--warn)}.alert.good{background:var(--accSoft)}
.alert .small{margin-top:8px}
.plan{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:14px;color:var(--mute);justify-content:center}.plan .done{color:var(--ok)}.plan .now{color:var(--acc);font-weight:800}
.total{text-align:center;margin:4px 0 12px;padding:12px;border-radius:12px;background:var(--ink);color:var(--bg)}.total b{display:block;font-size:30px;line-height:1.15}.total span{font-size:14px;opacity:.8}
.tl{list-style:none;margin:0;padding:0}.tl li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}.tl li:last-child{border:0}
.t{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;text-align:center}
.sum b{display:block;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}.sum span{font-size:13px;color:var(--mute)}
.warns{margin:10px 0 0;padding:0;list-style:none}.warns li{color:var(--bad);font-size:14px;padding:3px 0}.warns li::before{content:"⚠ "}
input,select{font:inherit;font-size:16px;min-height:44px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
.f{display:grid;gap:4px;margin-bottom:10px}.f label,.lbl{font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
@media(max-width:420px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font:inherit;font-size:14px;min-height:40px;min-width:46px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}.chips button[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:600;text-align:start;border-bottom:2px solid var(--ink);padding:6px 4px}
td{padding:8px 4px;border-bottom:1px solid var(--line)}
tr.d{cursor:pointer}tr.d:hover{background:light-dark(#f4f1ec,#262a28)}
tr.we td{color:var(--mute);background:light-dark(#f2efea,#1a1d1c)}
tr.wk td{font-weight:800;background:var(--accSoft);font-size:13px}
.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--accSoft);white-space:nowrap}
.badge.miss{background:var(--bad);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}.kpi span{font-size:12px;color:var(--mute)}
@media(max-width:600px){.hide-s{display:none}table{font-size:13px}}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.nav{position:fixed;inset:auto 0 0 0;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:4;padding-bottom:env(safe-area-inset-bottom)}
.nav button{font:inherit;font-size:13px;font-weight:600;background:none;border:0;color:var(--mute);min-height:62px;cursor:pointer;display:grid;place-items:center;gap:2px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current=page]{color:var(--acc)}
.toast{position:fixed;inset-inline:0;bottom:84px;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:6}
.dlg.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
.ev{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(122px,1fr) auto auto;gap:6px;margin-bottom:8px;align-items:center}
.ev.pl{grid-template-columns:minmax(128px,1fr) minmax(86px,.9fr) 46px 40px;gap:5px}.ev.pl .small{min-width:40px;padding:4px}.ev.pl input[type=number]{padding:6px 2px;text-align:center;-moz-appearance:textfield}.ev.pl input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.ev input,.ev select{padding:6px 7px}.ev .small{padding:6px;min-width:44px}
.nd{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mute);white-space:nowrap}.nd input{width:20px;min-height:20px}
.ulist{display:grid;gap:8px}.ulist button{display:flex;align-items:center;gap:10px;text-align:start;font:inherit;background:var(--bg);border:2px solid transparent;border-radius:12px;padding:8px;color:var(--ink);cursor:pointer;min-height:56px}.ulist button[aria-current=true]{border-color:var(--acc)}
.photo{display:flex;align-items:center;gap:16px;margin-bottom:12px}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="brand">
  <img class="logo" id="logo" alt="GST">
  <button class="who" id="who" aria-label="Profil"></button>
  <div class="lang" role="group" aria-label="Sprache / Language"><button data-l="de">DE</button><button data-l="en">EN</button></div>
</header>
<main class="wrap" id="view"></main>
<nav class="nav" id="nav"></nav>

<div class="dlg" id="dlg" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

const LS='timeclock.v2';
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>new Date(k+'T12:00');
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const toMin=s=>{const[a,b]=String(s||'0:0').split(':').map(Number);return a*60+(b||0)};
const fmt=m=>{m=Math.round(m);const s=m<0?'-':'';m=Math.abs(m);return s+Math.floor(m/60)+':'+pad(m%60)};
const fmtS=m=>(Math.round(m)>0?'+':'')+fmt(m);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);

let S={ui:'de',cur:null,users:{}};
let view='today',buzzed=new Set(),swReg=null;
const T=(de,en)=>S.ui==='en'?en:de;
const LOC=()=>S.ui==='en'?'en-GB':'de-DE';
const defProfile=()=>({first:'',last:'',photo:'',empNo:'',position:'',dept:'',company:'GST Elektro',supervisor:'',email:'',
  contract:'full',term:'unlimited',startDate:'',weekly:40,workdays:[1,2,3,4,5],vacYear:30,vacCarry:0,otOpen:0,trackFrom:'',
  state:'HH',remindOut:'18:30',plan:[{at:'10:00',t:'break',min:15},{at:'12:00',t:'lunch',min:30},{at:'14:00',t:'break',min:15}],lastBackup:0});
function newUser(first,last){const id=uid();S.users[id]={id,profile:Object.assign(defProfile(),{first:first||'',last:last||'',trackFrom:keyOf(new Date())}),days:{}};return id}
function load(){
  try{const o=JSON.parse(localStorage.getItem(LS)||'null');if(o&&o.users){S=o}}catch(e){}
  if(!S.users||!Object.keys(S.users).length){
    S={ui:'de',cur:null,users:{}};
    try{const old=JSON.parse(localStorage.getItem('timeclock.v1')||'null');
      if(old&&old.days){const nm=(old.meta&&old.meta.name||'').split(' ');const id=newUser(nm[0],nm.slice(1).join(' '));
        S.users[id].days=old.days;const ks=Object.keys(old.days).sort();if(ks.length)S.users[id].profile.trackFrom=ks[0];S.ui=old.meta&&old.meta.ui||'de';S.cur=id}}catch(e){}
  }
  for(const u of Object.values(S.users))u.profile=Object.assign(defProfile(),u.profile);
  if(!S.cur||!S.users[S.cur])S.cur=Object.keys(S.users)[0]||null;
}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast(T('Speicher voll – Foto verkleinern oder Sicherung speichern','Storage full – save a backup'))}}

const holCache={};
function holidays(y,st){
  const ck=y+st;if(holCache[ck])return holCache[ck];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const em=Math.floor((h+l-7*m+114)/31),ed=((h+l-7*m+114)%31)+1,E=y+'-'+pad(em)+'-'+pad(ed);

  const n23=new Date(y,10,23);let bb=new Date(n23);do{bb.setDate(bb.getDate()-1)}while(bb.getDay()!==3);add(keyOf(bb),'Buß- und Bettag',['SN']);
  return holCache[ck]=r;

const holName=k=>holidays(+k.slice(0,4),P().state)[k]||'';

/* ---------- day maths ---------- */
const TYPES={work:['Arbeit','Work'],vac:['Urlaub','Vacation'],sick:['Krank','Sick'],hol:['Feiertag','Holiday'],comp:['Freizeitausgleich','Time off in lieu']};
const typeName=t=>T(...TYPES[t]);
const EVN={in:['Arbeitsbeginn','Clock in'],break:['Pause','Break'],lunch:['Mittagspause','Lunch'],back:['Zurück','Back to work'],out:['Arbeitsende','Clock out']};
const evName=t=>T(...EVN[t]);
const absM=e=>toMin(e.at)+(e.nd?1440:0);
const sorted=ev=>[...(ev||[])].sort((a,b)=>absM(a)-absM(b));
const isWorkday=k=>P().workdays.includes(parseKey(k).getDay())&&!holName(k);
const dailyTarget=()=>Math.round((+P().weekly||0)*60/Math.max(1,P().workdays.length));
function liveNow(k){const n=new Date(),t=keyOf(n);if(k===t)return toMin(hm(n));if(k===addDays(t,-1))return toMin(hm(n))+1440;return null}
function calc(k){
  const day=D()[k],r={gross:0,work:0,brk:0,lunch:0,start:'',end:'',breaks:[],lunches:[],state:'off',startM:null,endM:null};
  if(!day||!day.ev||!day.ev.length)return r;
  let mode='off',since=0,sinceStr='';
  for(const e of sorted(day.ev)){
    const m=absM(e),lab=e.at;
    if(mode==='work')r.work+=m-since;
    if(mode==='break'){r.brk+=m-since;r.breaks.push(sinceStr+'–'+lab)}
    if(mode==='lunch'){r.lunch+=m-since;r.lunches.push(sinceStr+'–'+lab)}
    if(e.t==='in'&&r.startM===null){r.start=e.at;r.startM=m}
    if(e.t==='out'){r.end=e.at+(e.nd?' (+1)':'');r.endM=m}
    mode=e.t==='in'||e.t==='back'?'work':e.t==='break'?'break':e.t==='lunch'?'lunch':'done';since=m;sinceStr=lab;
  }
  const now=liveNow(k);
  if(now!==null&&mode!=='done'&&mode!=='off'){const dd=Math.max(0,now-since);if(mode==='work')r.work+=dd;if(mode==='break')r.brk+=dd;if(mode==='lunch')r.lunch+=dd}
  r.gross=r.work+r.brk+r.lunch;r.state=mode;return r;
}
/* the day a punch belongs to: yesterday if a shift is still open and it is before noon */
function activeKey(){
  const n=new Date(),t=keyOf(n),y=addDays(t,-1),ty=D()[t];
  if((!ty||!ty.ev||!ty.ev.length)&&n.getHours()<12){const st=calc(y).state;if(st==='work'||st==='break'||st==='lunch')return y}
  return t;
}
function dayInfo(k){
  const d=D()[k],today=keyOf(new Date()),c=calc(k),wd=isWorkday(k),target=wd?dailyTarget():0;
  let type=d&&d.type||(d&&d.ev&&d.ev.length?'work':(holName(k)?'hol':''));
  let ist=0,counted=true,missing=false;
  if(type==='vac'||type==='sick'||type==='hol')ist=target;
  else if(type==='comp')ist=0;
  else if(type==='work'){ist=c.work;if(c.state!=='done'&&(k===today||k===activeKey()))counted=false}
  else{ if(k>=today)counted=false; else if(wd&&k>=P().trackFrom)missing=true; }
  if(k<P().trackFrom)counted=false;
  return {k,type,c,wd,target,ist,diff:ist-target,counted,missing,hol:holName(k),note:d&&d.note||''};
}
function balance(upTo){
  let b=Math.round((+P().otOpen||0)*60),k=P().trackFrom||keyOf(new Date());
  const end=upTo<keyOf(new Date())?upTo:keyOf(new Date());
  let guard=0;while(k<=end&&guard++<4000){const i=dayInfo(k);if(i.counted)b+=i.diff;k=addDays(k,1)}
  return b;
}
function vacTaken(y,upTo){let n=0;for(const[k,d]of Object.entries(D()))if(k.startsWith(y)&&(!upTo||k<=upTo)&&d.type==='vac'&&isWorkday(k))n++;return n}
function warnings(k){
  const i=dayInfo(k),c=i.c,w=[];if(i.type!=='work'||!c.startM&&c.startM!==0)return w;
  const p=c.brk+c.lunch;
  if(c.work>360&&p<30)w.push(T('Mehr als 6 Std. Arbeit, aber weniger als 30 Min. Pause (§4 ArbZG)','Over 6 h work but under 30 min break (§4 ArbZG)'));
  if(c.work>540&&p<45)w.push(T('Mehr als 9 Std. Arbeit, aber weniger als 45 Min. Pause (§4 ArbZG)','Over 9 h work but under 45 min break (§4 ArbZG)'));
  if(c.work>600)w.push(T('Mehr als 10 Std. Arbeit an einem Tag (§3 ArbZG)','Over 10 h work in one day (§3 ArbZG)'));
  const pc=calc(addDays(k,-1));if(pc.endM!==null&&c.startM!==null){const rest=c.startM+1440-pc.endM;if(rest<660)w.push(T('Weniger als 11 Std. Ruhezeit seit gestern ('+fmt(rest)+') (§5 ArbZG)','Less than 11 h rest since yesterday ('+fmt(rest)+') (§5 ArbZG)'))}
  return w;
}
function isoWeek(k){const d=parseKey(k);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)}

function punch(type){

/* A4 landscape fit-to-width and the company logo, added straight into the xlsx package */

  else XLSX.CFB.utils.cfb_add(z,'xl/worksheets/_rels/sheet1.xml.rels',enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rel+'</Relationships>'));
  const w=110*E,h=45*E;
  XLSX.CFB.utils.cfb_add(z,'xl/drawings/drawing1.xml',enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><xdr:oneCellAnchor><xdr:from><xdr:col>0</xdr:col><xdr:colOff>'+6*E+'</xdr:colOff><xdr:row>0</xdr:row><xdr:rowOff>'+8*E+'</xdr:rowOff></xdr:from><xdr:ext cx="'+w+'" cy="'+h+'"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="2" name="Logo"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip r:embed="rIdImg"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="'+w+'" cy="'+h+'"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor></xdr:wsDr>'));
  XLSX.CFB.utils.cfb_add(z,'xl/drawings/_rels/drawing1.xml.rels',enc('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdImg" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/logo.png"/></Relationships>'));
  XLSX.CFB.utils.cfb_add(z,'xl/media/logo.png',png);
  const ct=get('[Content_Types].xml');let cx=dec(ct.content);
  if(!/Extension="png"/.test(cx))cx=cx.replace(/(<Types[^>]*>)/,'$1<Default Extension="png" ContentType="image/png"/>');
  cx=cx.replace('</Types>','<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/></Types>');

/* ---------- pdf (shareable on Android; Excel files cannot be shared from a web app) ---------- */
function buildPdf(){
  if(!window.jspdf){toast(T('PDF-Bibliothek nicht geladen','PDF library not loaded'));return null}
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const p=P(),m=month,s=monthStats(m),mid=parseKey(m+'-15'),W=297;
  const monthName=mid.toLocaleDateString('de-DE',{month:'long',year:'numeric'})+' / '+mid.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const ink=[20,18,16],acc=[38,146,130],mute=[107,101,93],red=[179,38,30],green=[31,107,58];
  doc.setFillColor(22,25,26);doc.rect(0,0,W,20,'F');doc.setFillColor(...acc);doc.rect(0,20,W,1,'F');
  try{doc.addImage(LOGO,'PNG',10,3.5,32,13)}catch(e){}
  doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('Arbeitszeitnachweis / Monthly Timesheet',50,12.5);
  const left=[['Mitarbeiter / Employee',fullName(p)],['Personalnr. / Employee no.',p.empNo],['Position / Abteilung',[p.position,p.dept].filter(Boolean).join(' · ')],['Vertrag / Contract',CONTRACTS[p.contract][0]+' / '+CONTRACTS[p.contract][1]+' · '+p.weekly+' Std./Woche'],['Vorgesetzte/r / Supervisor',p.supervisor],['Monat / Month',monthName]];
  const right=[['Soll / Target',fmt(s.soll)],['Ist / Actual',fmt(s.ist)],['Differenz / Difference',fmtS(s.diff)],['Überstunden-Saldo / Overtime balance',fmtS(s.bal)],['Urlaub Monat · Rest Jahr / Vacation month · left',s.vac+' · '+s.vacLeft],['Krankheitstage / Sick days',String(s.sick)]];
  doc.setFontSize(8.5);
  left.forEach(([a,b],i)=>{const y=27+i*3.9;doc.setFont('helvetica','bold');doc.setTextColor(...mute);doc.text(a,10,y);doc.setTextColor(...ink);doc.setFontSize(9);doc.text(String(b||''),55,y);doc.setFontSize(8.5)});
  right.forEach(([a,b],i)=>{const y=27+i*3.9;doc.setFont('helvetica','bold');doc.setTextColor(...mute);doc.text(a,180,y);doc.setFontSize(9);doc.setTextColor(...((i===2||i===3)?(b.startsWith('-')?red:green):ink));doc.text(b,W-10,y,{align:'right'});doc.setFontSize(8.5)});
  const head=[['Datum\nDate','Tag\nDay','Art\nType','Beginn\nStart','Pausen\nBreaks','Mittag\nLunch','Ende\nEnd','Pausen ges.\nTot. breaks','Anwesenheit\nAt work','Soll\nTarget','Ist\nActual','+/-','Bemerkung\nNote']];
  const body=[],meta=[];let wk=null,a={soll:0,ist:0,gross:0,brk:0};
  const flush=()=>{if(wk===null||(!a.soll&&!a.ist&&!a.gross))return;const d=a.ist-a.soll;
    body.push([{content:'Summe KW '+wk+' / Week '+wk+' total',colSpan:7},fmt(a.brk),fmt(a.gross),fmt(a.soll),fmt(a.ist),fmtS(d),'']);meta.push({week:true,neg:d<0})};
  for(const x of s.rows){
    const w=isoWeek(x.k);if(w!==wk){flush();wk=w;a={soll:0,ist:0,gross:0,brk:0}}
    if(x.counted){a.soll+=x.target;a.ist+=x.ist}if(x.type==='work'){a.gross+=x.c.gross;a.brk+=x.c.brk+x.c.lunch}
    const dt=parseKey(x.k),isW=x.type==='work',show=x.counted&&(x.type||x.missing||x.target);
    body.push([dt.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}),dt.toLocaleDateString('de-DE',{weekday:'short'})+' / '+dt.toLocaleDateString('en-GB',{weekday:'short'}),
      x.missing?'fehlt / missing':x.type?TYPES[x.type][0]+' / '+TYPES[x.type][1]:'',isW?x.c.start:'',isW?x.c.breaks.join(', '):'',isW?x.c.lunches.join(', '):'',isW?x.c.end:'',
      isW&&(x.c.brk+x.c.lunch)?fmt(x.c.brk+x.c.lunch):'',isW?fmt(x.c.gross):'',x.target?fmt(x.target):'',x.type||x.missing?fmt(x.ist):'',show?fmtS(x.diff):'',
      [x.hol&&x.type!=='work'?x.hol:'',x.note].filter(Boolean).join(' · ')]);
    meta.push({we:!x.wd,miss:x.missing,neg:x.diff<0});
  }
  flush();
  const foot=[[{content:'Summe / Total',colSpan:2},{content:s.work+' Arbeitstage / workdays',colSpan:5},fmt(s.brk),fmt(s.gross),fmt(s.soll),fmt(s.ist),fmtS(s.diff),'']];
  doc.autoTable({head,body,foot,startY:50,theme:'grid',margin:{left:10,right:10,bottom:14},
    showFoot:'lastPage',showHead:'everyPage',
    styles:{font:'helvetica',fontSize:6.6,cellPadding:{top:.4,bottom:.4,left:1,right:1},halign:'center',valign:'middle',lineColor:[201,195,186],lineWidth:.15,textColor:ink},
    headStyles:{fillColor:ink,textColor:255,fontStyle:'bold',fontSize:6.6},footStyles:{fillColor:[231,228,223],textColor:ink,fontStyle:'bold',fontSize:8.5},
    columnStyles:{4:{halign:'left',cellWidth:34},12:{halign:'left',cellWidth:38},10:{fontStyle:'bold'},11:{fontStyle:'bold'}},
    didParseCell:h=>{if(h.section==='foot'){if(h.column.index===11)h.cell.styles.textColor=s.diff<0?red:green;if(h.column.index===10)h.cell.styles.textColor=acc;if(h.column.index===0)h.cell.styles.halign='left';return}
      if(h.section!=='body')return;const mt=meta[h.row.index];if(!mt)return;
      if(mt.week){h.cell.styles.fillColor=[220,239,235];h.cell.styles.fontStyle='bold';if(h.column.index===0)h.cell.styles.halign='left'}
      else if(mt.we){h.cell.styles.fillColor=[237,234,229];h.cell.styles.textColor=mute}
      else if(h.row.index%2)h.cell.styles.fillColor=[246,244,241];
      if(mt.miss&&h.column.index===2){h.cell.styles.textColor=red;h.cell.styles.fontStyle='bold'}
      if(h.column.index===11&&h.cell.raw)h.cell.styles.textColor=mt.neg?red:green},
    didDrawPage:()=>{doc.setFontSize(7);doc.setTextColor(...mute);doc.text('Erstellt mit / Created with Arbeitszeit · Work time – '+new Date().toLocaleDateString('de-DE')+' · Feiertage / Holidays: '+STATES[p.state],10,203);doc.text(String(doc.internal.getNumberOfPages()),W-10,203,{align:'right'})}});
  let y=doc.lastAutoTable.finalY+12;if(y>197){doc.addPage();y=30}
  doc.setDrawColor(...ink);doc.setLineWidth(.3);doc.line(10,y,120,y);doc.line(177,y,W-10,y);
  doc.setFontSize(7.5);doc.setTextColor(...mute);doc.setFont('helvetica','normal');
  doc.text('Datum, Unterschrift Mitarbeiter / Date, employee signature',10,y+4);doc.text('Datum, Unterschrift Vorgesetzte/r / Date, supervisor signature',177,y+4);
  const fname=(fullName(p).replace(/\s+/g,'_')||'Mitarbeiter')+'_Arbeitszeit_'+m+'.pdf';
  return new File([doc.output('arraybuffer')],fname,{type:'application/pdf'});
}
async function share(){
  const f=buildPdf();if(!f)return;const p=P(),s=monthStats(month);
  const title=T('Arbeitszeitnachweis ','Timesheet ')+month+' – '+fullName(p);
  const text=title+'\n'+T('Ist','Actual')+': '+fmt(s.ist)+' · '+T('Soll','Target')+': '+fmt(s.soll)+' · '+T('Differenz','Difference')+': '+fmtS(s.diff);
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title,text});return}}
  catch(e){if(e&&e.name==='AbortError')return}
  saveFile(f.name,f);toast(T('Teilen nicht möglich – PDF wurde heruntergeladen','Sharing not available – PDF downloaded'));
}

/* ---------- onboarding ---------- */
function renderWelcome(){
  $('view').innerHTML=`<section class="card"><h2>${T('Willkommen!','Welcome!')}</h2><p>${T('Lege zuerst deinen Benutzer an.','First, create your user.')}</p>
  <div class="grid2"><div class="f"><label for="w-first">${T('Vorname','First name')}</label><input id="w-first"></div><div class="f"><label for="w-last">${T('Nachname','Last name')}</label><input id="w-last"></div></div>
  <button class="small primary" id="w-go">${T('Benutzer anlegen','Create user')}</button></section>`;
  $('w-go').onclick=()=>{const f=$('w-first').value.trim();if(!f){toast(T('Bitte Vorname eingeben','Please enter a first name'));return}
    S.cur=newUser(f,$('w-last').value.trim());save();view='profile';render();toast(T('Benutzer angelegt – jetzt Vertrag ausfüllen','User created – now fill in your contract'))};
}

/* ---------- wiring ---------- */
document.addEventListener('click',e=>{
  const l=e.target.closest('[data-l]');if(l){S.ui=l.dataset.l;save();U()?render():(renderChrome(),renderWelcome());return}
  const v=e.target.closest('[data-view]');if(v){if(!U())return;view=v.dataset.view;render();scrollTo(0,0);return}
  if(e.target.closest('#who')&&U()){view='profile';render();return}
  const pb=e.target.closest('[data-punch]');if(pb&&!pb.disabled){punch(pb.dataset.punch);return}
  const wd=e.target.closest('[data-wd]');if(wd){const d=+wd.dataset.wd,a=P().workdays;const i=a.indexOf(d);i<0?a.push(d):a.splice(i,1);save();renderProfile();return}
  const us=e.target.closest('[data-user]');if(us){S.cur=us.dataset.user;save();render();toast(fullName(P()));return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='edit')openEditor(a.dataset.d);
  else if(act==='undo'){const k=activeKey(),d=D()[k];if(!d||!d.ev.length)return;const last=sorted(d.ev).pop();d.ev.splice(d.ev.indexOf(last),1);d.updated=Date.now();if(!d.ev.length&&!d.note)delete D()[k];save();render();toast(T('Letzter Eintrag entfernt','Last entry removed'))}
  else if(act==='notif'){(async()=>{try{await Notification.requestPermission()}catch(err){}render()})()}
  else if(act==='backup')backup();
  else if(act==='xlsx'){const f=buildXlsx();if(f){saveFile(f.name,f);toast(T('Datei gespeichert','File saved'))}}
  else if(act==='share')share();
  else if(act==='pdf'){const f=buildPdf();if(f){saveFile(f.name,f);toast(T('Datei gespeichert','File saved'))}}
  else if(act==='nophoto'){P().photo='';save();render()}
  else if(act==='planadd'){P().plan.push({at:'16:00',t:'break',min:15});save();renderProfile()}
  else if(act==='plandel'){P().plan.splice(+a.dataset.i,1);save();renderProfile()}
  else if(act==='newuser'){S.cur=newUser(T('Neuer','New'),T('Benutzer','user'));save();render();scrollTo(0,0);toast(T('Neuer Benutzer angelegt','New user created'))}
  else if(act==='deluser'){if(a.dataset.sure!=='1'){a.dataset.sure='1';a.textContent=T('Wirklich löschen? Alle Zeiten gehen verloren – nochmal tippen','Really delete? All times will be lost – tap again');return}
    delete S.users[S.cur];S.cur=Object.keys(S.users)[0];save();render();toast(T('Benutzer gelöscht','User deleted'))}
});
document.addEventListener('change',e=>{
  const pf=e.target.closest('[data-p]');if(pf){setProfile(pf.dataset.p,pf.value);if(['state','trackFrom','first','last'].includes(pf.dataset.p))renderChrome();return}
  const pl=e.target.closest('[data-pl]');if(pl){const it=P().plan[+pl.dataset.pl],k=e.target.dataset.k;if(it&&k){it[k]=k==='min'?+e.target.value:e.target.value;P().plan.sort((a,b)=>toMin(a.at)-toMin(b.at));save();renderProfile()}}
});
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeDlg()});

load();$('logo').src=LOGO;
if(U())render();else{renderChrome();renderWelcome()}
setInterval(()=>{if(U()&&view==='today'&&!$('dlg').classList.contains('on'))renderToday()},15000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{})}
}
